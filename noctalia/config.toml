[bar.default]
end = [
    "tray",
    "bluetooth",
    "network",
    "group:g1",
    "volume",
    "brightness",
    "battery",
    "clipboard",
    "notifications",
    "session"
]
margin_ends = 34
shadow = false
start = [ "wallpaper", "workspaces", "launcher", "cat" ]
thickness = 30

    [bar.default.dead_zone.actions]
    right = "panel-toggle Not set"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
shadow = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 10000
temperature_night = 2400

[plugins]
enabled = [ "noctalia/bongocat" ]

[shell.panel]
shadow = false

[shell.screenshot]
save_to_file = false

[system.monitor]
cpu_temp_activity_threshold = 85
cpu_temp_critical_threshold = 100
disk_poll_seconds = 20

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "mango", "qt" ]

[wallpaper]
directory_dark = "~/Pictures/Wallpapers/DarkMode"
directory_light = "~/Pictures/Wallpapers/LightMode"

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/LightMode/mountFuji.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/LightMode/mountFuji.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/Wallpapers/LightMode/mountFuji.jpg"

[weather]
refresh_minutes = 240

[widget.cat]
input_devices = [ "/dev/input/by-id/usb-_Gaming_Keyboard-event-kbd" ]
type = "noctalia/bongocat:cat"
